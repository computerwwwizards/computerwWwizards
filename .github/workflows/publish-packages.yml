name: Publish packages (manual)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c
        with:
          cache: true

      - name: Build all packages
        run: pnpm --filter "./packages/**" run build 

      - name: Publish to npm
        
        run: |
          pnpm publish -r --access public --no-git-checks

      - name: Summary
        run: |
          echo "Publish completed. Packages marked private are skipped." >> $GITHUB_STEP_SUMMARY

